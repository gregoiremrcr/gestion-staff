name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests and builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Oxlint native Linux bindings
        shell: bash
        run: |
          mkdir -p /tmp/oxlint-native
          mkdir -p apps/api/node_modules/@oxlint/binding-linux-x64-gnu
          mkdir -p apps/api/node_modules/@oxlint-tsgolint/linux-x64
          npm pack @oxlint/binding-linux-x64-gnu@1.91.0 --pack-destination /tmp/oxlint-native
          npm pack @oxlint-tsgolint/linux-x64@7.0.2006 --pack-destination /tmp/oxlint-native
          tar -xzf /tmp/oxlint-native/oxlint-binding-linux-x64-gnu-1.91.0.tgz -C apps/api/node_modules/@oxlint/binding-linux-x64-gnu --strip-components=1
          tar -xzf /tmp/oxlint-native/oxlint-tsgolint-linux-x64-7.0.2006.tgz -C apps/api/node_modules/@oxlint-tsgolint/linux-x64 --strip-components=1

      - name: Lint API
        run: npm run lint:api

      - name: Lint web
        run: npm run lint:web

      - name: API unit tests
        run: npm run test:api

      - name: API end-to-end tests
        run: npm run test:e2e --workspace=apps/api

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
